spring.application.name=keystone-app
# Render (and most hosts) pass the port in $PORT; 8080 when running locally.
server.port=${PORT:8080}




# Database
# Local run -> H2
# Render -> PostgreSQL values come from Environment Variables
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/keystone;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 web console at /h2-console (username sa, blank password, JDBC URL above) - handy for peeking at data

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JWT
# Set KEYSTONE_JWT_SECRET (base64, 32+ bytes) in production. The fallback is for local runs only.
keystone.jwt.secret=${KEYSTONE_JWT_SECRET:U2VjcmV0S2V5Rm9yS2V5c3RvbmVEZW1vUHJvamVjdE5vdEZvclByb2R1Y3Rpb25Vc2UxMjM0NTY=}
keystone.jwt.expiration-ms=86400000

# File uploads (photos/videos) - max 10MB per file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary - the real keys are read from environment variables so they never get committed.
# Set CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY and CLOUDINARY_API_SECRET before starting the app.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

logging.level.org.springframework.security=INFO
