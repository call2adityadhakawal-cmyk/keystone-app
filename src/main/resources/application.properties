spring.application.name=keystone-app
server.port=8080

# Embedded file-based H2 database - no external DB server needed.
# Data is stored under ./data/keystone.mv.db and survives restarts.
spring.datasource.url=jdbc:h2:file:./data/keystone;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 web console at /h2-console (username sa, blank password, JDBC URL above) - handy for peeking at data
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
keystone.jwt.secret=U2VjcmV0S2V5Rm9yS2V5c3RvbmVEZW1vUHJvamVjdE5vdEZvclByb2R1Y3Rpb25Vc2UxMjM0NTY=
keystone.jwt.expiration-ms=86400000

logging.level.org.springframework.security=INFO
